# NETLab — nginx site config. Copy to /etc/nginx/sites-available/netlab,
# replace every netlab.example.ac.th with the real domain, then:
#   sudo ln -s /etc/nginx/sites-available/netlab /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Certificate paths assume the university supplies a cert (or certbot); adjust.

server {
    listen 80;
    server_name netlab.example.ac.th;
    return 301 https://$host$request_uri;   # Google Sign-In only works over https
}

server {
    listen 443 ssl;
    server_name netlab.example.ac.th;

    ssl_certificate     /etc/ssl/netlab/fullchain.pem;
    ssl_certificate_key /etc/ssl/netlab/privkey.pem;

    # Only the built React frontend is web-servable. Backend code, .env and
    # netlab.db live one level up in /opt/netlab and are never under this root.
    root  /opt/netlab/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # HTML names its content-hashed bundles, so it must always be revalidated
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change content under the same name.
    # /assets/topic-images/ is not hashed, so it is deliberately not matched here.
    location ~ ^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Backend (FastAPI on localhost only). The trailing slash strips /api, so
    # /api/progress reaches the app as /progress — what the frontend's API_BASE expects.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /chat can retry OpenRouter up to 3 times at 30s each
        proxy_read_timeout 120s;
    }

    # Defense in depth, in case root is ever pointed at the project folder
    location ~ /\.(env|git) { deny all; }
    location ~ \.(py|db)$    { deny all; }
    location /backups/       { deny all; }
}
