<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรไฟล์ — NETLab</title>
<link rel="stylesheet" href="styles/tokens.css?v=3">
<link rel="stylesheet" href="styles/shared.css?v=2">
<script src="scripts/auth.js?v=3"></script>
<style>
body{min-height:100vh}
.topbar{height:56px;gap:10px}
.wrap{max-width:560px;margin:0 auto;padding:var(--space-7) var(--space-5) var(--space-8)}

.profile-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:var(--space-7) var(--space-6);text-align:center;margin-bottom:var(--space-5)}
.profile-pic{width:96px;height:96px;border-radius:50%;margin:0 auto var(--space-4);overflow:hidden;border:2px solid var(--border)}
.profile-pic img{width:100%;height:100%;object-fit:cover;display:block}
.profile-pic-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--cyan-wash);color:var(--cyan);font-weight:800;font-size:36px}
.profile-name{font-size:var(--step-2xl);font-weight:700;margin-bottom:4px;letter-spacing:-0.01em}
.profile-email{font-size:var(--step-sm);color:var(--text3)}

.detail-list{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:var(--space-5)}
.detail-row{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border)}
.detail-row:last-child{border-bottom:none}
.detail-label{font-size:var(--step-sm);color:var(--text3)}
.detail-value{font-size:var(--step-sm);font-weight:600;font-family:var(--mono)}

.logout-btn{width:100%;padding:12px;border-radius:10px;background:none;border:1px solid var(--red-border);color:var(--red);font-weight:700;font-size:var(--step-sm);cursor:pointer;font-family:inherit}
.logout-btn:hover{background:var(--red-l)}
</style>
</head>
<body>
<script>requireAuth();</script>

<div class="topbar">
  <a class="brand" href="index.html">NET<span>Lab</span></a>
  <span class="crumb-sep">›</span>
  <span class="crumb current">โปรไฟล์</span>
  <div class="topbar-right">
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="โหมดกลางคืน">🌙</button>
  </div>
</div>

<div class="wrap">
  <div class="profile-card">
    <div class="profile-pic" id="profilePic"></div>
    <div class="profile-name" id="profileName"></div>
    <div class="profile-email" id="profileEmail"></div>
  </div>

  <div class="detail-list">
    <div class="detail-row"><span class="detail-label">รหัสนักศึกษา</span><span class="detail-value" id="profileSid"></span></div>
    <div class="detail-row"><span class="detail-label">อีเมล</span><span class="detail-value" id="profileEmail2"></span></div>
  </div>

  <button class="logout-btn" type="button" onclick="logout()">ออกจากระบบ</button>
</div>

<script src="scripts/theme.js?v=2"></script>
<script>
'use strict';
var profile = requireAuth();
if(profile){
  document.getElementById('profileName').textContent = profile.name;
  document.getElementById('profileEmail').textContent = profile.email || '—';
  document.getElementById('profileSid').textContent = profile.studentId || '—';
  document.getElementById('profileEmail2').textContent = profile.email || '—';
  if(profile.guest){
    document.getElementById('profileName').textContent = 'ผู้เยี่ยมชม (ไม่บันทึกความคืบหน้า)';
  }
  var pic = document.getElementById('profilePic');
  pic.innerHTML = profile.picture
    ? '<img src="'+profile.picture+'" alt="">'
    : '<div class="profile-pic-fallback">'+initials(profile.name)+'</div>';
}
</script>
</body>
</html>
